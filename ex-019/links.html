<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*
            Seletores Personalizados
            # = id
            . = class
            : = pseudo-class
            :: = pseudo-element
            > = clildren
        */

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            text-decoration: underline;
            color: black;
        }

        a:active{
            color: yellow;
        }

        .especial{
            background-color: rgb(212, 110, 110);
        }

        .especial::before{
            content: '⇨';
        }
        
        .especial::after{
            content: '⇦';
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/GuiH-Dev" target="_blank">Repositorio GitHub</a></li>
        <li><a href="https://www.instagram.com/ice.guilherme"
            class="especial">Instagram</a></li>
        <li><a href="https://www.cursoemvideo.com" class="especial">Site de CursoemVideo</a></li>
    </ul>
</body>
</html>
