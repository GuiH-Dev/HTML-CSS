<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
</head>
<body>
    <h1>Imagem dinamica</h1>
    <p>Tente abrir esse site em varios dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegador.</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/pequena.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagens/medio.png" type="image/png">
        <img src="imagens/grande.png" alt="Imagem flexivel">
    </picture>
    <h1>Reproduzindo Audio</h1>
    <p>Vamos aprender a reproduzir audios em HTML5.</p>
    <audio src="midia/Justin_Bieber_-_Baby_ft._Ludacris_(mp3.pm).mp3" controls autroplay></audio>
    <!-- MP3 WAV OGG -->

    <audio preload="metadata" autoplay controls>
        <source src="midia/Justin_Bieber_-_Baby_ft._Ludacris_(mp3.pm).mp3" type="audio/mpeg">
        <source src="midia/Justin_Bieber_-_Baby_ft._Ludacris_(mp3.pm).ogg" type="audio/ogg">
        <source src="midia/Justin_Bieber_-_Baby_ft._Ludacris_(mp3.pm).wav" type="audio/wav">
        <p>Infelizmente seu navegador nao consegue reproduzir audio. <a href="midia/Justin_Bieber_-_Baby_ft._Ludacris_(mp3.pm).mp3">Clique aqui</a> para baixar o arquivo MP3</p>
    </audio>
</body>
</html>
